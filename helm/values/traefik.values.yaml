---
# Traefik values — replaces ingress-nginx (retired 2026-03).
# ingressClass name kept as <name>-internal to mirror the video's nginx-internal.
ingressClass:
  enabled: true
  name: traefik-internal
  isDefaultClass: true
service:
  enabled: true
  annotations:
    metallb.universe.tf/allow-shared-ip: traefik-svc
  spec:
    type: LoadBalancer
    loadBalancerIP: 192.168.3.240
# Dashboard — enabled 2026-09-01; exposed via Ingress on traefik.home
# (traefik/values -> manifests/traefik-dashboard.yaml), auto DNS via external-dns.
api:
  dashboard: true
# Expose the api/dashboard port (8080) through the LoadBalancer Service so the
# Ingress can route to it.
ports:
  traefik:
    expose:
      default: true
    exposedPort: 8080
