---
# external-dns — values for the OFFICIAL kubernetes-sigs chart (v1.21.1)
# (the reference repo used the bitnami chart, which is no longer updated;
#  config keys differ. Pi-hole provider is configured via env vars.)
provider:
  name: pihole
policy: upsert-only
txtOwnerId: "homelab"
sources:
  - service
  - ingress
# Only sync Ingresses that use the Traefik ingressClass (was nginx-internal).
# Must match the class name exactly: Traefik values set ingressClass.name = traefik-internal
# --pihole-api-version=6: Pi-hole v6 (chart installs 2026.07) — v5 API is deprecated.
extraArgs:
  ingress-class: traefik-internal
  pihole-api-version: "6"
env:
  - name: EXTERNAL_DNS_PIHOLE_SERVER
    value: http://pihole-web.pihole-system.svc.cluster.local
  - name: EXTERNAL_DNS_PIHOLE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: pihole-password
        key: password
serviceAccount:
  create: true
  name: "external-dns"
