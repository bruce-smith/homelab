---
# Homepage values — m0nsterrr-homepage 5.2.0 (Homepage v2.2.0)
# Deployed via helmfile (OCI chart). Config files are injected from the
# homepage-config ConfigMap (manifests/homepage-config.yaml) via volumeMounts.
replicaCount: 1

config:
  allowedHosts:
    - homepage.home

# RBAC on → Homepage can show cluster status (kubernetes widget)
rbac:
  enabled: true

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  ingressClassName: traefik-internal
  hosts:
    - host: homepage.home
      paths:
        - path: /
          pathType: Prefix

# Mount the config files (from homepage-config ConfigMap) into /app/config.
# These sit alongside the chart's emptyDir config volume — the ConfigMap files
# overlay it read-only; /app/config/logs stays writable from the emptyDir.
volumeMounts:
  - name: homepage-config
    mountPath: /app/config/services.yaml
    subPath: services.yaml
    readOnly: true
  - name: homepage-config
    mountPath: /app/config/widgets.yaml
    subPath: widgets.yaml
    readOnly: true
  - name: homepage-config
    mountPath: /app/config/settings.yaml
    subPath: settings.yaml
    readOnly: true
  - name: homepage-config
    mountPath: /app/config/bookmarks.yaml
    subPath: bookmarks.yaml
    readOnly: true
  - name: homepage-config
    mountPath: /app/config/kubernetes.yaml
    subPath: kubernetes.yaml
    readOnly: true
  - name: homepage-config
    mountPath: /app/config/docker.yaml
    subPath: docker.yaml
    readOnly: true
  - name: homepage-config
    mountPath: /app/config/custom.css
    subPath: custom.css
    readOnly: true
  - name: homepage-config
    mountPath: /app/config/custom.js
    subPath: custom.js
    readOnly: true

volumes:
  - name: homepage-config
    configMap:
      name: homepage-config
