---
# Pi-hole values — adapted 2026-09-01 from dreamsofautonomy/homelab
# Network: 192.168.3.0/24 (was 192.168.1.0/24 in the video)
DNS1:
  192.168.3.1
persistentVolumeClaim:
  enabled: true
ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - "pihole.home"
serviceWeb:
  loadBalancerIP: 192.168.3.240
  annotations:
    metallb.universe.tf/allow-shared-ip: pihole-svc
  type: LoadBalancer
serviceDns:
  loadBalancerIP: 192.168.3.240
  annotations:
    metallb.universe.tf/allow-shared-ip: pihole-svc
  type: LoadBalancer
replicaCount: 1
