---
# Longhorn UI — exposed via Ingress on longhorn.home
# external-dns (watching class traefik-internal) auto-creates the A record.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-ui
  namespace: longhorn-system
spec:
  ingressClassName: traefik-internal
  rules:
    - host: longhorn.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: longhorn-frontend
                port:
                  number: 80
