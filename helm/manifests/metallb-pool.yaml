---
# MetalLB configuration — IPAddressPool + L2Advertisement
# Applied by helmfile hook (postsync) because the MetalLB chart ships
# controllers but no pool by default.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: homelab-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.3.240-192.168.3.249
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: homelab-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - homelab-pool
