# ============================================================
# Homelab services — helmfile
# Modernized 2026-09-01 from dreamsofautonomy/homelab (video) +
# updated chart versions + ingress-nginx replaced with Traefik.
#
#  - Longhorn    (distributed storage)    v1.12.1
#  - MetalLB     (bare-metal LB)          v0.16.1
#  - Pi-hole     (ad blocking + DNS)      v2.38.0
#  - external-dns(pihole DNS sync)        v1.21.1
#  - Traefik     (ingress)                v41.4.0  <-- replaces ingress-nginx (retired 2026-03)
#
# IP scheme: LAN = 192.168.3.0/24
#   - EdgeOS DHCP reservations: node0 .126, node1 .166, node2 .189
#   - MetalLB pool:             192.168.3.240-192.168.3.249
#   - Pi-hole shared IP:        192.168.3.240
#   - Traefik shared IP:        192.168.3.240
# ============================================================

repositories:
  - name: longhorn
    url: https://charts.longhorn.io
  - name: metallb
    url: https://metallb.github.io/metallb
  - name: mojo2600
    url: https://mojo2600.github.io/pihole-kubernetes
  - name: external-dns
    url: https://kubernetes-sigs.github.io/external-dns/
  - name: traefik
    url: https://traefik.github.io/charts
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: grafana
    url: https://grafana.github.io/helm-charts

helmDefaults:
  createNamespace: true
  wait: true
  timeout: 600

releases:
  # ---- Distributed storage ----
  # backup-target-secret (Backblaze B2 creds) is sops-encrypted in
  # values/b2-backup-secret.sops.yaml. A presync hook decrypts + applies it
  # so Longhorn's BackupTarget controller has credentials (applied before
  # the chart so the controller never sees a missing secret).
  - name: longhorn
    namespace: longhorn-system
    chart: longhorn/longhorn
    version: 1.12.1
    hooks:
      - events: ["presync"]
        showlogs: true
        command: sh
        args:
          - -c
          - "sops -d values/b2-backup-secret.sops.yaml | kubectl apply -f -"
      # Nightly 2AM RecurringJob -> Backblaze B2 (declarative since 2026-09-09)
      - events: ["postsync"]
        showlogs: true
        command: kubectl
        args: ["apply", "--server-side", "-f", "manifests/longhorn-recurringjob.yaml"]

  # ---- Bare-metal load balancer ----
  # MetalLB needs its IPAddressPool + L2Advertisement CRs, applied after install.
  - name: metallb
    namespace: metallb-system
    chart: metallb/metallb
    version: 0.16.1
    hooks:
      - events: ["postsync"]
        showlogs: true
        command: kubectl
        args: ["apply", "--server-side", "-f", "manifests/metallb-pool.yaml"]

  # ---- DNS sinkhole (ad-blocking) ----
  # adminPassword is sops-encrypted in values/pihole.sops.yaml. Helmfile's
  # auto-sops-detection is unreliable on Windows, so a presync hook decrypts it
  # to a gitignored temp file (values/.pihole-secrets.yaml) before rendering.
  - name: pihole
    namespace: pihole-system
    chart: mojo2600/pihole
    version: 2.38.0
    values:
      - values/pihole.values.yaml
      - values/.pihole-secrets.yaml
    hooks:
      - events: ["presync"]
        showlogs: true
        command: sh
        args:
          - -c
          - "sops -d values/pihole.sops.yaml > values/.pihole-secrets.yaml"

  # ---- Automatic DNS records for the cluster ----
  - name: external-dns
    namespace: pihole-system
    chart: external-dns/external-dns
    version: 1.21.1
    values:
      - values/externaldns.values.yaml

  # ---- Ingress controller (replaces retired ingress-nginx) ----
  - name: traefik
    namespace: traefik-system
    chart: traefik/traefik
    version: 41.4.0
    values:
      - values/traefik.values.yaml

  # ---- Dashboard (homepage.home) ----
  # m0nsterrr-homepage 5.2.0 = Homepage v2.2.0 (current). Config files
  # (services/widgets/settings/bookmarks) come from the homepage-config
  # ConfigMap, applied by the presync hook before the chart renders.
  - name: homepage
    namespace: homepage
    chart: oci://ghcr.io/m0nsterrr/helm-charts/homepage
    version: 5.2.0
    values:
      - values/homepage.values.yaml
    hooks:
      - events: ["presync"]
        showlogs: true
        command: kubectl
        args: ["apply", "-f", "manifests/homepage-config.yaml"]

  # ---- Observability (monitoring.home) ----
  # kube-prometheus-stack (Prometheus + Grafana + node-exporter +
  # kube-state-metrics + Alertmanager) + Loki (logs) + Alloy (collector).
  # Grafana is exposed at grafana.home via the grafana ingress.
  # WindowsNode (DC) is scraped as a static target once windows_exporter
  # is installed there (see values/kubeprometheus.values.yaml).
  - name: kube-prometheus-stack
    namespace: monitoring
    chart: prometheus-community/kube-prometheus-stack
    version: 89.2.1
    values:
      - values/kubeprometheus.values.yaml

  - name: loki
    namespace: monitoring
    chart: grafana/loki
    version: 7.3.0
    values:
      - values/loki.values.yaml

  - name: alloy
    namespace: monitoring
    chart: grafana/alloy
    version: 1.12.1
    values:
      - values/alloy.values.yaml

  # ---- Hermes Agent (Victoria) ----
  # Runs the agent 24/7 on the cluster so cron keeps working with the PC off.
  # Local chart: Deployment (hermes + rclone sidecar), 3 Longhorn PVCs, the
  # rclone bisync ConfigMap. Google Drive is mirrored into /mnt/gdrive by bisync
  # so the job scripts read ordinary file paths there.
  #
  # The Drive credentials (rclone.conf) are sops-encrypted in
  # values/rclone-gdrive.sops.yaml and applied by the presync hook - same
  # pattern as longhorn's b2-backup-secret. The Secret must exist before the
  # pod schedules, hence presync.
  - name: hermes
    namespace: hermes-system
    chart: ./charts/hermes
    hooks:
      # The namespace is created FIRST: on a fresh cluster the Secret apply would
      # otherwise fail with "namespaces \"hermes-system\" not found", because
      # helm only creates the namespace during the release install - which runs
      # after presync hooks. (longhorn's equivalent hook gets away with it only
      # because longhorn-system already exists by then.)
      - events: ["presync"]
        showlogs: true
        command: sh
        args:
          - -c
          - "kubectl create namespace hermes-system --dry-run=client -o yaml | kubectl apply -f - && sops -d values/rclone-gdrive.sops.yaml | kubectl apply -f - && sops -d values/hermes-dashboard-auth.sops.yaml | kubectl apply -f -"
