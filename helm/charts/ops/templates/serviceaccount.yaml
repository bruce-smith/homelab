apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-sa
  namespace: ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ops-sa-cluster-admin
subjects:
  - kind: ServiceAccount
    name: ops-sa
    namespace: ops
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
