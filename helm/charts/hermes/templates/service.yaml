{{/* hermes services: web dashboard (9119) + gateway API (8642). */}}
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: hermes-system
  labels:
    app: hermes
spec:
  selector:
    app: hermes
  ports:
    - name: dashboard
      port: {{ .Values.dashboard.port }}
      targetPort: dashboard
    - name: api
      port: 8642
      targetPort: api
