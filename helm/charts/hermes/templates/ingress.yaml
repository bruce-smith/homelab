{{/* hermes.home - web dashboard. external-dns watches the traefik-internal
     ingress class and creates the A record (hermes.home -> 192.168.3.240). */}}
{{- if .Values.dashboard.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes
  namespace: hermes-system
  labels:
    app: hermes
spec:
  ingressClassName: traefik-internal
  rules:
    - host: hermes.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes
                port:
                  number: {{ .Values.dashboard.port }}
{{- end }}
